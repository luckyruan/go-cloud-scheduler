name: Go checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: project_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d project_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://ci:ci_test_password@localhost:5432/project_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Check code
        run: go vet ./...
      - name: Test with race detector and isolated PostgreSQL schema
        run: go test -race -count=1 -v ./...
      - name: Build all packages
        run: go build ./...

